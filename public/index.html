<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCT Discography & Sub-unit Explorer</title>
    <style>
        /* ================== ดีไซน์สไตล์ Apple Music ================== */
        :root {
            --apple-red: #FA243C;
            --bg-color: #FBFBFD;
            --card-bg: #FFFFFF;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --border: #E5E5EA;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { margin: 0; background-color: var(--bg-color); color: var(--text-main); }
        
        header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; padding: 20px 40px; border-bottom: 1px solid var(--border); z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        
        .controls { display: flex; gap: 15px; }
        input, select { padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); font-size: 14px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--apple-red); }
        
        .unit-tabs { display: flex; gap: 10px; padding: 20px 40px; overflow-x: auto; }
        .tab-btn { padding: 8px 16px; border-radius: 20px; border: none; background: #E8E8ED; color: var(--text-main); font-weight: 600; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--apple-red); color: white; }

        .unit-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin: 10px 0 30px; }
        .unit-card { background: linear-gradient(135deg, #fff3f4 0%, #ffffff 100%); border: 1px solid #F3D6DA; border-radius: 18px; padding: 20px; text-align: left; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 8px 18px rgba(250, 36, 60, 0.06); }
        .unit-card:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(250, 36, 60, 0.12); }
        .unit-badge { display: inline-block; background: rgba(250,36,60,0.1); color: var(--apple-red); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; margin-bottom: 12px; }
        .unit-card h3 { margin: 0 0 10px; font-size: 26px; }
        .unit-card p { margin: 0 0 8px; color: var(--text-main); font-weight: 600; line-height: 1.5; }
        .unit-card small { color: var(--text-sub); line-height: 1.6; }

        .container { padding: 0 40px 40px; }
        .section-title { font-size: 22px; font-weight: 700; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        /* Grid เพลง */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; animation: fadeIn 0.5s ease-out; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-bottom: 1px solid var(--border); }
        .card-info { padding: 12px; }
        .track-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .artist-name { color: var(--text-sub); font-size: 13px; }

        /* แอนิเมชัน Fade */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ================== Modal / Popup ================== */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s ease; z-index: 999; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--card-bg); width: 90%; max-width: 500px; border-radius: 20px; padding: 30px; transform: scale(0.95); transition: 0.3s ease; box-shadow: 0 25px 50px rgba(0,0,0,0.15); position: relative; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .close-btn { position: absolute; top: 20px; right: 20px; background: #E8E8ED; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; color: var(--text-sub); }
        
        .modal-header { display: flex; gap: 20px; margin-bottom: 20px; }
        .modal-header img { width: 120px; height: 120px; border-radius: 12px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .modal-header div { flex: 1; }
        .modal-title { font-size: 20px; font-weight: 700; margin: 0 0 5px 0; color: var(--text-main); }
        .modal-sub { color: var(--apple-red); font-weight: 600; font-size: 15px; margin: 0 0 10px 0; }
        
        .modal-data { font-size: 13px; color: var(--text-sub); line-height: 1.6; background: #F5F5F7; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .modal-data span { color: var(--text-main); font-weight: 500; }

        .apple-btn { display: block; text-align: center; background: var(--apple-red); color: white; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: 600; transition: 0.2s; }
        .apple-btn:hover { background: #E01B2F; }
    </style>
</head>
<body>

    <header>
        <h1>NCT Discography</h1>
        <div class="controls">
            <!-- ระบบค้นหา (ใช้ลอจิก Hash Table ฝั่ง Backend) -->
            <input type="text" id="searchInput" placeholder="Search song, album, unit..." oninput="debounceSearch()">
            
            <!-- ระบบ Sorting (ใช้ลอจิกเรียงข้อมูลฝั่ง Backend) -->
            <select id="sortSelect" onchange="fetchData()">
                <option value="newest">Release Date (ใหม่ -> เก่า)</option>
                <option value="oldest">Release Date (เก่า -> ใหม่)</option>
                <option value="az">Song Name (A - Z)</option>
                <option value="za">Song Name (Z - A)</option>
            </select>
        </div>
    </header>

    <div class="unit-tabs" id="unitTabs">
        <button class="tab-btn active" data-unit="ALL" onclick="setUnit('ALL', this)">All Units</button>
        <button class="tab-btn" data-unit="NCT 127" onclick="setUnit('NCT 127', this)">NCT 127</button>
        <button class="tab-btn" data-unit="NCT DREAM" onclick="setUnit('NCT DREAM', this)">NCT DREAM</button>
        <button class="tab-btn" data-unit="NCT U" onclick="setUnit('NCT U', this)">NCT U</button>
        <button class="tab-btn" data-unit="NCT WISH" onclick="setUnit('NCT WISH', this)">NCT WISH</button>
    </div>

    <div class="container">
        <h2 class="section-title">Unit Spotlight</h2>
        <div class="unit-card-grid" id="unitCardGrid"></div>

        <!-- Section: Top 3 (Mock-up) -->
        <h2 class="section-title">Top 3 Most Streamed (Mock-up)</h2>
        <div class="grid" id="top3Grid" style="margin-bottom: 40px;"></div>

        <!-- Section: All Tracks -->
        <h2 class="section-title">Discography</h2>
        <div class="grid" id="songsGrid"></div>
    </div>

    <!-- Modal (Popup) -->
    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal(true)">✕</button>
            <div class="modal-header">
                <img id="modalImg" src="" alt="cover">
                <div>
                    <h3 class="modal-title" id="modalTrack">Track Name</h3>
                    <p class="modal-sub" id="modalArtist">Artist Name</p>
                    <p class="modal-sub" style="color: var(--text-sub); font-size: 13px;" id="modalCollection">Collection</p>
                </div>
            </div>
            <div class="modal-data">
                <div>Track ID: <span id="m-trackId"></span></div>
                <div>Collection ID: <span id="m-collectionId"></span></div>
                <div>Artist ID: <span id="m-artistId"></span></div>
                <div>Release Date: <span id="m-date"></span></div>
            </div>
            <a href="#" id="modalLink" class="apple-btn" target="_blank">Listen on Apple Music 🎵</a>
        </div>
    </div>

    <script>
        let currentUnit = 'ALL';
        let timeout = null;
        let currentSongsData = []; // เก็บอ้างอิงข้อมูลไว้แสดงใน popup

        // เปลี่ยนแท็บ Unit
        function setUnit(unit, btnElement) {
            currentUnit = unit;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            fetchData();
        }

        // หน่วงเวลาพิมพ์ค้นหา (ไม่ให้ยิง API รัวเกินไป)
        function debounceSearch() {
            clearTimeout(timeout);
            timeout = setTimeout(() => fetchData(), 300);
        }

        // ขอรูปภาพความละเอียดสูง (แปลงจาก 100x100 เป็น 400x400)
        function getHighResImage(url) {
            return url.replace('100x100bb', '400x400bb');
        }

        // ดึงข้อมูลจาก Backend ของเรา
        async function fetchData() {
            const sort = document.getElementById('sortSelect').value;
            const search = document.getElementById('searchInput').value;
            
            const res = await fetch(`/api/songs?unit=${currentUnit}&sort=${sort}&search=${search}`);
            const data = await res.json();
            
            currentSongsData = data.songs;
            renderGrid(data.top3, 'top3Grid');
            renderGrid(data.songs, 'songsGrid');
        }

        // เรนเดอร์การ์ดลงหน้าเว็บ
        function renderGrid(items, containerId) {
            const container = document.getElementById(containerId);
            if (items.length === 0) {
                container.innerHTML = `<p style="color:var(--text-sub)">No results found.</p>`;
                return;
            }
            container.innerHTML = items.map(song => {
                const imgUrl = getHighResImage(song.artworkUrl100);
                // แนบ ID เพลงไปกับฟังก์ชันเปิด Modal
                return `
                    <div class="card" onclick="openModal(${song.trackId})">
                        <img src="${imgUrl}" alt="cover" loading="lazy">
                        <div class="card-info">
                            <div class="track-name">${song.trackName}</div>
                            <div class="artist-name">${song.artistName}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ================== ระบบ Modal ==================
        function openModal(trackId) {
            // หา object เพลงจาก ID
            const song = currentSongsData.find(s => s.trackId === trackId);
            if(!song) return;

            document.getElementById('modalImg').src = getHighResImage(song.artworkUrl100);
            document.getElementById('modalTrack').innerText = song.trackName;
            document.getElementById('modalArtist').innerText = song.artistName;
            document.getElementById('modalCollection').innerText = song.collectionName;
            
            document.getElementById('m-trackId').innerText = song.trackId;
            document.getElementById('m-collectionId').innerText = song.collectionId;
            document.getElementById('m-artistId').innerText = song.artistId;
            document.getElementById('m-date').innerText = new Date(song.releaseDate).toLocaleDateString();
            
            document.getElementById('modalLink').href = song.trackViewUrl;

            // เล่นแอนิเมชัน Fade-in
            document.getElementById('modal').classList.add('active');
        }

        function closeModal(force = false) {
            if(force || event.target.id === 'modal') {
                document.getElementById('modal').classList.remove('active');
            }
        }

        function renderUnitCards() {
            const unitCards = [
                {
                    name: 'NCT U',
                    tag: 'Special Unit',
                    members: 'Taeil • Doyoung • Jaehyun • Jungwoo • Mark • Xiaojun • Hendery • Ten • Yangyang',
                    description: 'Flexible NCT lineup with varied vocals, dynamic performances, and iconic unit tracks.'
                }
            ];

            const container = document.getElementById('unitCardGrid');
            container.innerHTML = unitCards.map(unit => `
                <button class="unit-card" type="button" onclick="setUnit('${unit.name}', document.querySelector('.tab-btn[data-unit=\"${unit.name}\"]'))">
                    <span class="unit-badge">${unit.tag}</span>
                    <h3>${unit.name}</h3>
                    <p>${unit.members}</p>
                    <small>${unit.description}</small>
                </button>
            `).join('');
        }

        // โหลดข้อมูลครั้งแรกเมื่อเปิดหน้าเว็บ
        renderUnitCards();
        fetchData();
    </script>
</body>
</html>
